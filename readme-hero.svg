<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">303box — browser acid sequencer</title>
  <desc id="desc">Dark acid-green promotional banner for 303box with a live waveform, 16-step sequencer and rhythm grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070708"/>
      <stop offset="0.68" stop-color="#0d0d10"/>
      <stop offset="1" stop-color="#171b09"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="12%" r="62%">
      <stop offset="0" stop-color="#ddff37" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#ddff37" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ddff37" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="waveGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1400" height="620" rx="34" fill="url(#bg)"/>
  <rect width="1400" height="620" rx="34" fill="url(#glow)"/>
  <g opacity=".15" stroke="#ffffff" stroke-width="1">
    <path d="M0 80H1400M0 160H1400M0 240H1400M0 320H1400M0 400H1400M0 480H1400M0 560H1400"/>
    <path d="M100 0V620M200 0V620M300 0V620M400 0V620M500 0V620M600 0V620M700 0V620M800 0V620M900 0V620M1000 0V620M1100 0V620M1200 0V620M1300 0V620"/>
  </g>
  <circle cx="1180" cy="80" r="180" fill="#ddff37" opacity=".04" filter="url(#soft)"/>

  <g transform="translate(74 72)">
    <rect width="92" height="44" rx="12" fill="#17171b" stroke="#34343a"/>
    <text x="46" y="29" text-anchor="middle" fill="#ddff37" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="900">303</text>
    <text x="112" y="29" fill="#f4f4ef" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="900">303box</text>
  </g>

  <g transform="translate(74 160)">
    <text fill="#ddff37" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" letter-spacing="4">ACID PATTERN LABORATORY</text>
    <text y="76" fill="#f7f7f3" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="900" letter-spacing="-2">Build the line.</text>
    <text y="140" fill="#f7f7f3" font-family="Arial,Helvetica,sans-serif" font-size="60" font-weight="900" letter-spacing="-2">Drive the rhythm.</text>
    <text y="204" fill="#a3a3aa" font-family="Arial,Helvetica,sans-serif" font-size="22">16-step 303 sequencing, rhythm, live scope and browser MIDI.</text>
    <g transform="translate(0 254)" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="800">
      <rect width="128" height="38" rx="19" fill="#ddff37"/><text x="64" y="25" text-anchor="middle" fill="#080809">303 SEQUENCER</text>
      <rect x="140" width="124" height="38" rx="19" fill="#16161a" stroke="#34343a"/><text x="202" y="25" text-anchor="middle" fill="#d8d8dc">RHYTHM</text>
      <rect x="276" width="112" height="38" rx="19" fill="#16161a" stroke="#34343a"/><text x="332" y="25" text-anchor="middle" fill="#d8d8dc">MIDI</text>
      <rect x="400" width="112" height="38" rx="19" fill="#16161a" stroke="#34343a"/><text x="456" y="25" text-anchor="middle" fill="#d8d8dc">SCOPE</text>
    </g>
    <text y="346" fill="#74747b" font-family="monospace" font-size="16">303box.com</text>
  </g>

  <g transform="translate(760 94)">
    <rect width="566" height="430" rx="26" fill="#0d0d10" stroke="#303038" stroke-width="2"/>
    <path d="M0 64H566" stroke="#2b2b31"/>
    <text x="26" y="40" fill="#777780" font-family="monospace" font-size="14" font-weight="700" letter-spacing="3">303box / SIGNAL</text>
    <text x="494" y="40" fill="#ddff37" font-family="monospace" font-size="14" font-weight="900" letter-spacing="2">LIVE</text>

    <g transform="translate(28 92)">
