      <rect x="14" y="62" width="126" height="32" rx="7" fill="#16161a" stroke="#34343b"/><rect x="150" y="62" width="100" height="32" rx="7" fill="#16161a" stroke="#34343b"/><rect x="260" y="62" width="106" height="32" rx="7" fill="#151b09" stroke="#60721a"/>
