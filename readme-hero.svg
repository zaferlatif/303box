<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">303box — acid workstation for browser and MIDI hardware</title>
  <desc id="desc">A dark neon acid workstation interface with 303 sequencer, rhythm, scope and MIDI hardware controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050506"/><stop offset=".56" stop-color="#0a0a0d"/><stop offset="1" stop-color="#111707"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#111116"/><stop offset="1" stop-color="#09090b"/></linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e7ff38"/><stop offset="1" stop-color="#bfff18"/></linearGradient>
    <radialGradient id="halo" cx="86%" cy="15%" r="64%"><stop stop-color="#dfff31" stop-opacity=".18"/><stop offset=".42" stop-color="#dfff31" stop-opacity=".035"/><stop offset="1" stop-color="#dfff31" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1600" height="760" rx="38" fill="url(#bg)"/>
  <rect width="1600" height="760" rx="38" fill="url(#halo)"/>
  <g opacity=".11" stroke="#89908d"><path d="M0 95H1600M0 190H1600M0 285H1600M0 380H1600M0 475H1600M0 570H1600M0 665H1600"/><path d="M100 0V760M200 0V760M300 0V760M400 0V760M500 0V760M600 0V760M700 0V760M800 0V760M900 0V760M1000 0V760M1100 0V760M1200 0V760M1300 0V760M1400 0V760M1500 0V760"/></g>
  <circle cx="1435" cy="92" r="220" fill="#dfff31" opacity=".045" filter="url(#soft)"/>

  <g transform="translate(76 68)">
    <rect width="112" height="50" rx="13" fill="#15151a" stroke="#35353c"/>
    <text x="56" y="33" text-anchor="middle" fill="#dfff31" font-family="monospace" font-size="22" font-weight="900">303</text>
    <text x="135" y="34" fill="#f7f7f3" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="900">303box</text>
    <text x="276" y="34" fill="#707078" font-family="monospace" font-size="14" font-weight="700" letter-spacing="3">Z3Z / ACID SYSTEM</text>
  </g>

  <g transform="translate(76 185)">
    <text fill="#dfff31" font-family="monospace" font-size="16" font-weight="900" letter-spacing="5">BROWSER ACID WORKSTATION</text>
    <text y="78" fill="#fafaf6" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="-3">Sequence the acid.</text>
    <text y="150" fill="#fafaf6" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900" letter-spacing="-3">Drive the hardware.</text>
    <text y="205" fill="#9a9aa2" font-family="Arial,Helvetica,sans-serif" font-size="23">303 bass + rhythm + live scope + MIDI, in one focused instrument.</text>

    <g transform="translate(0 258)" font-family="monospace" font-size="13" font-weight="800">
      <rect width="154" height="40" rx="20" fill="url(#acid)"/><text x="77" y="25" text-anchor="middle" fill="#09090a">16 STEP 303</text>
      <rect x="166" width="124" height="40" rx="20" fill="#15151a" stroke="#35353c"/><text x="228" y="25" text-anchor="middle" fill="#d7d7dc">RHYTHM</text>
      <rect x="302" width="124" height="40" rx="20" fill="#15151a" stroke="#35353c"/><text x="364" y="25" text-anchor="middle" fill="#d7d7dc">WEB MIDI</text>
      <rect x="438" width="116" height="40" rx="20" fill="#15151a" stroke="#35353c"/><text x="496" y="25" text-anchor="middle" fill="#d7d7dc">SCOPE</text>
