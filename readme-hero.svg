      <rect x="14" y="108" width="68" height="28" rx="6" fill="#16161a" stroke="#34343b"/><rect x="90" y="108" width="68" height="28" rx="6" fill="#16161a" stroke="#34343b"/><rect x="166" y="108" width="86" height="28" rx="6" fill="#16161a" stroke="#34343b"/><rect x="260" y="108" width="106" height="28" rx="6" fill="#211011" stroke="#6c2d29"/>
      <text x="48" y="126" text-anchor="middle" fill="#9b9ba3" font-family="monospace" font-size="8">BASS 2</text><text x="124" y="126" text-anchor="middle" fill="#9b9ba3" font-family="monospace" font-size="8">RHY 10</text><text x="209" y="126" text-anchor="middle" fill="#9b9ba3" font-family="monospace" font-size="8">CLOCK</text><text x="313" y="126" text-anchor="middle" fill="#ff7069" font-family="monospace" font-size="8" font-weight="900">PANIC</text>
    </g>

