        <path d="M85 0V190M170 0V190M255 0V190M340 0V190M425 0V190"/>
      </g>
      <path d="M0 95 C20 28 42 28 62 95 S104 162 124 95 S166 28 186 95 S228 162 248 95 S290 28 310 95 S352 162 372 95 S414 28 434 95 S476 162 510 95" fill="none" stroke="#ddff37" stroke-width="4" filter="url(#waveGlow)"/>
    </g>

    <g transform="translate(28 310)">
      <g fill="#151519" stroke="#37373e">
        <rect x="0" width="26" height="30" rx="5"/><rect x="31" width="26" height="30" rx="5"/><rect x="62" width="26" height="30" rx="5"/><rect x="93" width="26" height="30" rx="5"/><rect x="124" width="26" height="30" rx="5"/><rect x="155" width="26" height="30" rx="5"/><rect x="186" width="26" height="30" rx="5"/><rect x="217" width="26" height="30" rx="5"/><rect x="248" width="26" height="30" rx="5"/><rect x="279" width="26" height="30" rx="5"/><rect x="310" width="26" height="30" rx="5"/><rect x="341" width="26" height="30" rx="5"/><rect x="372" width="26" height="30" rx="5"/><rect x="403" width="26" height="30" rx="5"/><rect x="434" width="26" height="30" rx="5"/><rect x="465" width="26" height="30" rx="5"/>
      </g>
      <g fill="#2b3509" stroke="#a8c719">
        <rect x="0" width="26" height="30" rx="5"/><rect x="93" width="26" height="30" rx="5"/><rect x="155" width="26" height="30" rx="5"/><rect x="248" width="26" height="30" rx="5"/><rect x="310" width="26" height="30" rx="5"/><rect x="403" width="26" height="30" rx="5"/><rect x="465" width="26" height="30" rx="5"/>
      </g>
    </g>

    <g transform="translate(28 370)" font-family="monospace" font-size="12" font-weight="700" fill="#777780" letter-spacing="2">
      <text>ACCENT</text><text x="94">SLIDE</text><text x="174">RHYTHM</text><text x="282">MIDI</text>
    </g>
  </g>

  <rect x="1" y="1" width="1398" height="618" rx="33" fill="none" stroke="#2b2b31" stroke-width="2"/>
</svg>
